version: "3.8"

services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: water_dispatch_db
    environment:
      POSTGRES_DB: water_dispatch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: water_dispatch_mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: water_dispatch_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/water_dispatch
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    volumes:
      - ./frontend:/app/frontend

  dtu-simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile.dtu
    container_name: water_dispatch_dtu
    environment:
      API_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  plc-simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile.plc
    container_name: water_dispatch_plc
    environment:
      MQTT_BROKER: mosquitto
    depends_on:
      - mosquitto
    restart: unless-stopped

volumes:
  pgdata:
